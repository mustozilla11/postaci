<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postacı</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Üst Sekme Çubuğu (KDE Breeze uyumlu minimalist stil) -->
  <header id="tab-bar-container">
    <div id="tabs-list" class="tabs-list">
      <!-- Sekmeler dinamik olarak buraya eklenecek -->
    </div>
    <div class="actions">
      <button id="btn-add-account" class="icon-button" title="Yeni Hesap Ekle">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <div id="app-badge" class="app-badge" title="Postacı Sürümü">v0.3.1</div>
    </div>
  </header>

  <!-- Karşılama ve İlk Hesap Seçim Ekranı -->
  <main id="welcome-screen" class="welcome-screen hidden">
    <div class="welcome-card">
      <div class="welcome-logo">
        <svg viewBox="0 0 128 128" width="64" height="64">
          <defs>
            <linearGradient id="wel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#3584e4" />
              <stop offset="100%" stop-color="#1c71d8" />
            </linearGradient>
          </defs>
          <rect width="128" height="128" rx="28" fill="url(#wel-grad)" />
          <path d="M24 38c0-4.4 3.6-8 8-8h64c4.4 0 8 3.6 8 8v52c0 4.4-3.6 8-8 8H32c-4.4 0-8-3.6-8-8V38z" fill="#ffffff" opacity="0.95"/>
          <path d="M26 34l38 30 38-30" stroke="#3584e4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <h2>Postacı'ya Hoş Geldiniz</h2>
      <p class="welcome-desc">Başlamak için bağlamak istediğiniz e-posta servisini seçin:</p>

      <div class="quick-providers">
        <button class="provider-btn" data-service="gmail">
          <span class="provider-icon service-svg" data-service="gmail"></span>
          <div class="provider-info">
            <span class="provider-title">Gmail</span>
            <span class="provider-sub">Google Mail Hesabı</span>
          </div>
        </button>

        <button class="provider-btn" data-service="m365">
          <span class="provider-icon service-svg" data-service="m365"></span>
          <div class="provider-info">
            <span class="provider-title">Microsoft 365</span>
            <span class="provider-sub">Üniversite & İş Hesabı (mu.edu.tr)</span>
          </div>
        </button>

        <button class="provider-btn" data-service="outlook">
          <span class="provider-icon service-svg" data-service="outlook"></span>
          <div class="provider-info">
            <span class="provider-title">Outlook / Live</span>
            <span class="provider-sub">Kişisel Hotmail & Outlook</span>
          </div>
        </button>

        <button class="provider-btn" data-service="icloud">
          <span class="provider-icon service-svg" data-service="icloud"></span>
          <div class="provider-info">
            <span class="provider-title">iCloud</span>
            <span class="provider-sub">Apple Mail Hesabı</span>
          </div>
        </button>

        <button class="provider-btn" data-service="custom">
          <span class="provider-icon service-svg" data-service="custom"></span>
          <div class="provider-info">
            <span class="provider-title">Özel Webmail</span>
            <span class="provider-sub">Kişisel ya da Şirket Sunucusu</span>
          </div>
        </button>
      </div>
    </div>
  </main>

  <!-- Hesap Ekleme / Düzenleme Modal Penceresi -->
  <div id="account-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Hesap Ekle</h3>
        <button id="btn-modal-close" class="close-button">&times;</button>
      </div>
      <form id="account-form">
        <input type="hidden" id="edit-account-id" value="">
        
        <div class="form-group">
          <label>E-Posta Servisi</label>
          <div class="service-selector">
            <label class="service-option">
              <input type="radio" name="service" value="gmail" checked>
              <div class="service-card">
                <span class="service-svg" data-service="gmail"></span>
                <span>Gmail</span>
              </div>
            </label>
            <label class="service-option">
              <input type="radio" name="service" value="m365">
              <div class="service-card">
                <span class="service-svg" data-service="m365"></span>
                <span>Microsoft 365</span>
              </div>
            </label>
            <label class="service-option">
              <input type="radio" name="service" value="outlook">
              <div class="service-card">
                <span class="service-svg" data-service="outlook"></span>
                <span>Outlook / Live</span>
              </div>
            </label>
            <label class="service-option">
              <input type="radio" name="service" value="icloud">
              <div class="service-card">
                <span class="service-svg" data-service="icloud"></span>
                <span>iCloud</span>
              </div>
            </label>
            <label class="service-option">
              <input type="radio" name="service" value="custom">
              <div class="service-card">
                <span class="service-svg" data-service="custom"></span>
                <span>Özel URL</span>
              </div>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="account-name">Hesap Adı / Etiketi</label>
          <input type="text" id="account-name" placeholder="Örn: Kişisel, İş, Okul" required>
        </div>

        <div class="form-group" id="group-custom-url" style="display: none;">
          <label for="account-url">Giriş / Webmail Bağlantısı (URL)</label>
          <input type="url" id="account-url" placeholder="https://webmail.orneksite.com">
        </div>

        <div class="modal-footer">
          <button type="button" id="btn-modal-cancel" class="btn-secondary">Vazgeç</button>
          <button type="submit" class="btn-primary">Kaydet ve Başlat</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Sekme Sağ Tık Menüsü (Context Menu) -->
  <div id="context-menu" class="context-menu hidden">
    <div class="menu-item" id="ctx-reload">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      <span>Yenile</span>
    </div>
    <div class="menu-item" id="ctx-edit">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
      </svg>
      <span>Hesabı Düzenle</span>
    </div>
    <div class="menu-separator"></div>
    <div class="menu-item danger" id="ctx-close">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
      <span>Sekmeyi Kapat / Sil</span>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
