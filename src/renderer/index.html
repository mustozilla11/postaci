<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postacı</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Üst Sekme Çubuğu (KDE Breeze uyumlu minimalist stil) -->
  <header id="tab-bar-container">
    <div id="tabs-list" class="tabs-list">
      <!-- Sekmeler dinamik olarak buraya eklenecek -->
    </div>
    <div class="actions">
      <button id="btn-add-account" class="icon-button" title="Yeni Hesap Ekle">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <div id="app-badge" class="app-badge" title="Postacı Sürümü">v0.1.0</div>
    </div>
  </header>

  <!-- Boş Durum (Hesap yoksa) -->
  <div id="empty-state" class="empty-state hidden">
    <div class="empty-card">
      <div class="empty-icon">✉️</div>
      <h2>Henüz bir e-posta hesabı eklenmedi</h2>
      <p>Gmail, Outlook veya iCloud hesaplarınızı ekleyerek başlayabilirsiniz.</p>
      <button id="btn-empty-add" class="btn-primary">Yeni Hesap Ekle</button>
    </div>
  </div>

  <!-- Hesap Ekleme / Düzenleme Modal Penceresi -->
  <div id="account-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Yeni Hesap Ekle</h3>
        <button id="btn-modal-close" class="close-button">&times;</button>
      </div>
      <form id="account-form">
        <input type="hidden" id="edit-account-id" value="">
        
        <div class="form-group">
          <label>E-Posta Servisi</label>
          <div class="service-selector">
            <label class="service-option">
              <input type="radio" name="service" value="gmail" checked>
              <div class="service-card">
                <span class="service-svg" data-service="gmail"></span>
                <span>Gmail</span>
              </div>
            </label>
            <label class="service-option">
              <input type="radio" name="service" value="outlook">
              <div class="service-card">
                <span class="service-svg" data-service="outlook"></span>
                <span>Outlook</span>
              </div>
            </label>
            <label class="service-option">
              <input type="radio" name="service" value="icloud">
              <div class="service-card">
                <span class="service-svg" data-service="icloud"></span>
                <span>iCloud</span>
              </div>
            </label>
            <label class="service-option">
              <input type="radio" name="service" value="custom">
              <div class="service-card">
                <span class="service-svg" data-service="custom"></span>
                <span>Özel URL</span>
              </div>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="account-name">Hesap Adı / Takma Ad</label>
          <input type="text" id="account-name" placeholder="Örn: Kişisel Gmail, Şirket E-Postası" required>
        </div>

        <div class="form-group" id="group-custom-url" style="display: none;">
          <label for="account-url">Giriş / Webmail Bağlantısı (URL)</label>
          <input type="url" id="account-url" placeholder="https://webmail.orneksite.com">
        </div>

        <div class="modal-footer">
          <button type="button" id="btn-modal-cancel" class="btn-secondary">Vazgeç</button>
          <button type="submit" class="btn-primary">Kaydet ve Aç</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Sekme Sağ Tık Menüsü (Context Menu) -->
  <div id="context-menu" class="context-menu hidden">
    <div class="menu-item" id="ctx-reload">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      <span>Yenile</span>
    </div>
    <div class="menu-item" id="ctx-edit">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
      </svg>
      <span>Hesabı Düzenle</span>
    </div>
    <div class="menu-separator"></div>
    <div class="menu-item danger" id="ctx-close">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
      <span>Sekmeyi Kapat / Sil</span>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
